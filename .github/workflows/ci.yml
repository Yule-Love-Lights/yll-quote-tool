# CI gates — the same three checks AGENTS.md requires before any merge
# (npx tsc --noEmit · npm run lint · npm test), run automatically on every PR
# to master and on master itself.
#
# WHY THIS EXISTS: master auto-deploys to production, and until now nothing
# forced the gates to run before a merge — Vercel type-checks and lints during
# `next build` but never runs vitest, so a green local suite protected nothing
# if a dev forgot to run it. Four customer-facing bugs reached prod this way
# (the allowlist misses fixed in #605/#614, and the phone-dedup class). This
# makes the gates a visible status check on the PR.
#
# NOTE: this workflow RUNS the checks; it does not BLOCK a merge on them, and
# on this repo it CAN'T yet. Marking "gates" a required status check needs
# branch protection (or a ruleset), and GitHub restricts both to Pro/Team on
# PRIVATE repos — the Yule-Love-Lights org is on the free plan, so both APIs
# return 403 (verified 2026-07-21). Until the org upgrades, enforcement is the
# AGENTS.md convention "the CI gates check must be GREEN before any merge",
# i.e. a human/assistant reads `gh pr checks <n>` and declines a red merge.
# On upgrade: mark "gates" required for master and this note can go.
#
# tsc expectation: locally the only tsc errors are that @playwright/test isn't
# installed (OneDrive eats node_modules); a clean `npm ci` here installs it, and
# Vercel's own `next build` type-check already passes on every deploy, so tsc is
# expected to be clean in CI. If the first run shows e2e-spec type errors, that
# is a real pre-existing gap for a follow-up, not a regression from a PR.

name: CI

# MARKDOWN-ONLY PUSHES DON'T RUN (row 355). The org is on the free plan's 2000
# Actions minutes, and an exhausted balance fails every workflow repo-wide with
# an instant no-runner error — S66 diagnosed exactly that. A .md file cannot
# affect tsc, lint or vitest, so a push touching ONLY the paths below spends
# nothing. `paths-ignore` skips only when EVERY changed file matches, so a PR
# mixing prose with code still runs the full gates.
#
# ⚠️ THE GLOB IS `docs/**/*.md`, NOT `docs/**`, AND THAT IS LOAD-BEARING.
# `docs/` is not only prose: it holds `context/ops-contract-schema/
# flow-q-contract.test.ts` (a REAL vitest test, 3 cases, inside tsconfig's
# `**/*.ts` include), plus `generate-schema.mjs` and several .json fixtures.
# Ignoring all of `docs/**` would have silently stopped gating a live test file.
# Caught by the S70 wrap process lens before this merged. If you widen this
# list, check `git ls-files <path> | grep -v '\.md$'` first.
#
# `.claude/**` is deliberately NOT ignored: skills, commands and settings.json
# change how the assistants behave, and that is not something to make cheaper to
# land unreviewed.
#
# ⚠️ TWO CONSEQUENCES, both deliberate, do not "fix" them by surprise:
#   1. A markdown-only PR has NO `gates` check at all — not a red one, not a
#      green one, simply absent. AGENTS.md says to verify gates green before
#      merging; for such a PR the correct reading is "no run is expected", NOT
#      the missing-run fallback of running gates locally and saying CI did not
#      run. (The wrap skill's own close PR is unaffected either way: wrap step 1
#      already runs all three gates locally before it commits, so it never
#      depended on this check. An earlier draft of this comment claimed it did;
#      that was wrong.)
#   2. If `gates` is ever made a REQUIRED status check (see the note above about
#      the free plan), a skipped workflow leaves that check permanently pending
#      and blocks every markdown-only PR forever. The fix at that point is a
#      companion job that reports success for the ignored paths, not deleting
#      this block. Decide it then; this comment is the warning.
on:
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**/*.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'README.md'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**/*.md'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'README.md'

# A new push to the same branch cancels an in-flight run for it — no point
# gating a commit that's already been superseded. (This half of row 355 was
# already in place before that row was actioned; only the docs skip was new.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs from the lockfile exactly (incl. @playwright/test), so
      # the type-check sees a complete tree — unlike the OneDrive-synced local
      # checkout where modules go missing.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
